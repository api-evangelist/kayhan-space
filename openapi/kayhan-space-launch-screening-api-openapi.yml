            $ref: '#/components/schemas/ObjectTypeCategory'
          type: array
          title: Secondary Types
        percent_blackout:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Percent Blackout
      type: object
      required:
      - primary
      - launch_window_periods
      - secondary_types
      - percent_blackout
      title: LaunchWindowPrimary
