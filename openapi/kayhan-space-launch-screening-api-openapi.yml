          - type: number
          - type: 'null'
          title: Specific Impulse
        rso_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Rso Id
      type: object
      required:
      - id
      - type
      - ignition_epoch
      title: ManeuverRead
    StateVectorRead:
      properties:
