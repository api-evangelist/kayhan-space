        vel_y:
          type: number
          title: Vel Y
        vel_z:
          type: number
          title: Vel Z
        vel_unit:
          type: string
          title: Vel Unit
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        frame:
          type: string
          title: Frame
        mass:
          type: number
          title: Mass
        coeff_drag:
