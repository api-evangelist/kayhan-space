          - type: 'null'
          title: Oceantides Degree
        oceantides_order:
          anyOf:
          - type: integer
          - type: 'null'
          title: Oceantides Order
      type: object
      required:
      - id
      title: ForceModelRead
    EphemerisViewer:
      properties:
        ephemeris_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Ephemeris Id
        event_key_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Event Key Number
      type: object
