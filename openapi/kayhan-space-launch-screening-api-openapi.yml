          - type: 'null'
          title: Deltav Unit
        thrust_x:
          anyOf:
          - type: number
          - type: 'null'
          title: Thrust X
        thrust_y:
          anyOf:
          - type: number
          - type: 'null'
          title: Thrust Y
        thrust_z:
          anyOf:
          - type: number
          - type: 'null'
          title: Thrust Z
        thrust_unit:
          anyOf:
