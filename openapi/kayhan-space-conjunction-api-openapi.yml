          title: Updated At
        tca_range_start:
          type: string
          format: date-time
          title: Tca Range Start
        tca_range_end:
          type: string
          format: date-time
          title: Tca Range End
        auto_intent_enabled:
          type: boolean
          title: Auto Intent Enabled
        default_cdm:
          $ref: '#/components/schemas/ConjunctionRead'
      type: object
      required:
      - id
      - key
      - created_at
      - updated_at
      - tca_range_start
      - tca_range_end
