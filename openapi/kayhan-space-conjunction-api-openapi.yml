openapi: 3.1.0
info:
  title: Satcat Service Authentication Conjunction API
  description: '

    Kayhan Space''s Satcat Service API.


    ## Features

    * **View** historical CDM data for an object.

    * **View** latest CDM data for an object.

    '
  contact:
    email: help@kayhan.space
  version: 1.0.0
servers:
- url: /api/satcat
tags:
- name: Conjunction
paths:
  /conjunction_messages:
    get:
      tags:
      - Conjunction
      summary: List Conjunction Messages
      description: List the conjunction messages to which the currently authenticated user has read access.
      operationId: list_conjunction_messages_conjunction_messages_get
      security:
      - Oauth2Scheme: []
      parameters:
      - name: latest_for
        in: query
        required: false
        schema:
          type: string
          description: key or cdm_id of conjunction message to get latest data for
          title: Latest For
        description: key or cdm_id of conjunction message to get latest data for
      - name: history_for
        in: query
        required: false
        schema:
          type: string
          description: key or cdm_id of conjunction message to get history data for
          title: History For
        description: key or cdm_id of conjunction message to get history data for
      - name: operational
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to include only CDMs with designation 'OPERATIONAL' in the result; defaults to true
          default: true
          title: Operational
        description: Whether to include only CDMs with designation 'OPERATIONAL' in the result; defaults to true
      - name: filters
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            contentMediaType: application/json
            contentSchema: {}
          - type: 'null'
          title: Filters
      - name: sort_field
        in: query
        required: false
        schema:
          type: string
          default: creation_date
          title: Sort Field
      - name: sort_direction
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortDirection'
          default: desc
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      - name: count
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Count
      - name: fields
        in: query
        required: false
        schema:
          type: string
          title: Fields
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffsetPageResult_ConjunctionListRead_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Conjunction
      summary: Upload Cdms
      description: Upload one or more CDMs as a Super Admin.
      operationId: upload_cdms_conjunction_messages_post
      security:
      - Oauth2Scheme: []
      parameters:
      - name: group_slug
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Group Slug
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_cdms_conjunction_messages_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConjunctionRead'
                title: Response Upload Cdms Conjunction Messages Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /conjunction_messages/ccsds:
    get:
      tags:
      - Conjunction
      summary: List Conjunction Messages
      description: List the conjunction messages to which the currently authenticated user has read access in CCSDS format.
      operationId: list_conjunction_messages_conjunction_messages_ccsds_get
      security:
      - Oauth2Scheme: []
      parameters:
      - name: latest_for
        in: query
        required: false
        schema:
          type: string
          description: key or cdm_id of conjunction message to get latest data for
          title: Latest For
        description: key or cdm_id of conjunction message to get latest data for
      - name: history_for
        in: query
        required: false
        schema:
          type: string
          description: key or cdm_id of conjunction message to get history data for
          title: History For
        description: key or cdm_id of conjunction message to get history data for
      - name: operational
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to include only CDMs with designation 'OPERATIONAL' in the result; defaults to true
          default: true
          title: Operational
        description: Whether to include only CDMs with designation 'OPERATIONAL' in the result; defaults to true
      - name: filters
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            contentMediaType: application/json
            contentSchema: {}
          - type: 'null'
          title: Filters
      - name: sort_field
        in: query
        required: false
        schema:
          type: string
          default: creation_date
          title: Sort Field
      - name: sort_direction
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortDirection'
          default: desc
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      - name: count
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Count
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffsetPageResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /events:
    get:
      tags:
      - Conjunction
      summary: List Events
      description: List the events to which the currently authenticated user has read access.
      operationId: list_events_events_get
      security:
      - Oauth2Scheme: []
      parameters:
      - name: filters
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            contentMediaType: application/json
            contentSchema: {}
          - type: 'null'
          title: Filters
      - name: sort_field
        in: query
        required: false
        schema:
          type: string
          default: created_at
          title: Sort Field
      - name: sort_direction
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortDirection'
          default: desc
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      - name: count
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Count
      - name: fields
        in: query
        required: false
        schema:
          type: string
          title: Fields
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffsetPageResult_EventRead_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /events/{event_key}/ccsds_cdm:
    post:
      tags:
      - Conjunction
      summary: Add Cdm To Event
      description: Add a CCSDS JSON CDM to an event. The CDM must have the same primary and secondary objects as the associated event. Returns the created conjunction.
      operationId: add_cdm_to_event_events__event_key__ccsds_cdm_post
      security:
      - Oauth2Scheme: []
      parameters:
      - name: event_key
        in: path
        required: true
        schema:
          type: string
          description: key of the event to add the CDM to
          title: Event Key
        description: key of the event to add the CDM to
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_add_cdm_to_event_events__event_key__ccsds_cdm_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConjunctionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /conjunction_messages/{cdm_id}/file:
    get:
      tags:
      - Conjunction
      summary: Get Cdm File
      description: Retrieve raw conjunction messages with given key or cdm_id.
      operationId: get_cdm_file_conjunction_messages__cdm_id__file_get
      security:
      - Oauth2Scheme: []
      parameters:
      - name: cdm_id
        in: path
        required: true
        schema:
          type: string
          description: key or cdm_id of conjunction message
          title: Cdm Id
        description: key or cdm_id of conjunction message
      - name: updated
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Updated
      - name: file_format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CDMWriteFormat'
          default: JSON
      responses:
        '200':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /conjunction_messages/{cdm_id}:
    get:
      tags:
      - Conjunction
      summary: Get Conjunction Message By Id
      description: Retrieve all conjunction messages with given key, cdm_id (18th SDS), or Satcat UUID.
      operationId: get_conjunction_message_by_id_conjunction_messages__cdm_id__get
      security:
      - Oauth2Scheme: []
      parameters:
      - name: cdm_id
        in: path
        required: true
        schema:
          type: string
          description: key, cdm_id, or uuid of conjunction message
          title: Cdm Id
        description: key, cdm_id, or uuid of conjunction message
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConjunctionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /conjunction_messages/{cdm_id}/ccsds:
    get:
      tags:
      - Conjunction
      summary: Get Conjunction Message By Id
      description: Retrieve conjunction message with given key or cdm_id in CCSDS format.
      operationId: get_conjunction_message_by_id_conjunction_messages__cdm_id__ccsds_get
      security:
      - Oauth2Scheme: []
      parameters:
      - name: cdm_id
        in: path
        required: true
        schema:
          type: string
          description: key or cdm_id of conjunction message
          title: Cdm Id
        description: key or cdm_id of conjunction message
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Conjunction Message By Id Conjunction Messages  Cdm Id  Ccsds Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /conjunction_messages/{cdm_id}/pc_remediation:
    post:
      tags:
      - Conjunction
      summary: Request Pc Remediation
      description: Manually request remediation of a CDM's collision probability value. Returns the updated conjunction message in CCSDS JSON format.
      operationId: request_pc_remediation_conjunction_messages__cdm_id__pc_remediation_post
      security:
      - Oauth2Scheme: []
      parameters:
      - name: cdm_id
        in: path
        required: true
        schema:
          type: string
          description: key or cdm_id of conjunction message
          title: Cdm Id
        description: key or cdm_id of conjunction message
      - name: method
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PCRemediationMethod'
          default: hall
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Request Pc Remediation Conjunction Messages  Cdm Id  Pc Remediation Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
