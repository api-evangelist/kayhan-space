openapi: 3.1.0
info:
  title: Satcat Service Authentication Events API
  description: '

    Kayhan Space''s Satcat Service API.


    ## Features

    * **View** historical CDM data for an object.

    * **View** latest CDM data for an object.

    '
  contact:
    email: help@kayhan.space
  version: 1.0.0
servers:
- url: /api/satcat
tags:
- name: Events
paths:
  /events/{event_key}/cdms:
    get:
      tags:
      - Events
      summary: List Event Cdms
      description: List the CDMs in the event.
      operationId: list_event_cdms_events__event_key__cdms_get
      security:
      - Oauth2Scheme: []
      parameters:
      - name: event_key
        in: path
        required: true
        schema:
          type: string
          description: key of the event
          title: Event Key
        description: key of the event
      - name: operational
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to include only CDMs with designation 'OPERATIONAL' in the result; defaults to true
          default: true
          title: Operational
        description: Whether to include only CDMs with designation 'OPERATIONAL' in the result; defaults to true
      - name: filters
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            contentMediaType: application/json
            contentSchema: {}
          - type: 'null'
          title: Filters
      - name: sort_field
        in: query
        required: false
        schema:
          type: string
          default: created_at
          title: Sort Field
      - name: sort_direction
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortDirection'
          default: desc
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      - name: count
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Count
      - name: fields
        in: query
        required: false
        schema:
          type: string
          title: Fields
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffsetPageResult_ConjunctionRead_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /events/{event_key}/latest_cdms:
    get:
      tags:
      - Events
      summary: List Event Latest Cdms
      description: List the CDMs in the event.
      operationId: list_event_latest_cdms_events__event_key__latest_cdms_get
      security:
      - Oauth2Scheme: []
      parameters:
      - name: event_key
        in: path
        required: true
        schema:
          type: string
          description: key of the event
          title: Event Key
        description: key of the event
      - name: operational
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to include only CDMs with designation 'OPERATIONAL' in the result; defaults to true
          default: true
          title: Operational
        description: Whether to include only CDMs with designation 'OPERATIONAL' in the result; defaults to true
      - name: filters
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            contentMediaType: application/json
            contentSchema: {}
          - type: 'null'
          title: Filters
      - name: sort_field
        in: query
        required: false
        schema:
          type: string
          default: created_at
          title: Sort Field
      - name: sort_direction
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortDirection'
          default: desc
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      - name: count
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Count
      - name: fields
        in: query
        required: false
        schema:
          type: string
          title: Fields
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffsetPageResult_ConjunctionRead_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
