openapi: 3.1.0
info:
  title: Satcat Service Authentication Mitigation API
  description: '

    Kayhan Space''s Satcat Service API.


    ## Features

    * **View** historical CDM data for an object.

    * **View** latest CDM data for an object.

    '
  contact:
    email: help@kayhan.space
  version: 1.0.0
servers:
- url: /api/satcat
tags:
- name: Mitigation
paths:
  /conjunction_messages/{cdm_id}/mitigation_scenarios:
    get:
      tags:
      - Mitigation
      summary: List Mitigation Scenarios
      description: List mitigation scenarios available for a conjunction message.
      operationId: list_mitigation_scenarios_conjunction_messages__cdm_id__mitigation_scenarios_get
      security:
      - Oauth2Scheme: []
      parameters:
      - name: cdm_id
        in: path
        required: true
        schema:
          type: string
          description: key or cdm_id of conjunction message
          title: Cdm Id
        description: key or cdm_id of conjunction message
      - name: filters
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            contentMediaType: application/json
            contentSchema: {}
          - type: 'null'
          title: Filters
      - name: sort_field
        in: query
        required: false
        schema:
          type: string
          default: created_at
          title: Sort Field
      - name: sort_direction
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortDirection'
          default: desc
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      - name: count
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Count
      - name: fields
        in: query
        required: false
        schema:
          type: string
          title: Fields
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffsetPageResult_MitigationScenarioRead_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Mitigation
      summary: Create Mitigation Scenario
      description: Create a mitigation scenario on the cdm id from an ephemeris id
      operationId: create_mitigation_scenario_conjunction_messages__cdm_id__mitigation_scenarios_post
      security:
      - Oauth2Scheme: []
      parameters:
      - name: cdm_id
        in: path
        required: true
        schema:
          type: string
          title: Cdm Id
      - name: ephem_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Ephem Id
      - name: group_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Optional group ID to use for the request
          title: Group Id
        description: Optional group ID to use for the request
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /conjunction_messages/{cdm_id}/mitigation_scenarios/{scenario_id}:
    get:
      tags:
      - Mitigation
      summary: Get Mitigation Scenario
      description: Get a mitigation scenario by ID.
      operationId: get_mitigation_scenario_conjunction_messages__cdm_id__mitigation_scenarios__scenario_id__get
      security:
      - Oauth2Scheme: []
      parameters:
      - name: cdm_id
        in: path
        required: true
        schema:
          type: string
          title: Cdm Id
      - name: scenario_id
        in: path
        required: true
        schema:
          type: string
          title: Scenario Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /conjunction_messages/{cdm_id}/mitigation_scenarios/opm:
    post:
      tags:
      - Mitigation
      summary: Create Mitigation Scenario From Opm
      description: Create a mitigation scenario on the cdm id from opm file
      operationId: create_mitigation_scenario_from_opm_conjunction_messages__cdm_id__mitigation_scenarios_opm_post
      security:
      - Oauth2Scheme: []
      parameters:
      - name: cdm_id
        in: path
        required: true
        schema:
          type: string
          title: Cdm Id
      - name: group_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Optional group ID to use for the request
          title: Group Id
        description: Optional group ID to use for the request
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_mitigation_scenario_from_opm_conjunction_messages__cdm_id__mitigation_scenarios_opm_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /conjunction_messages/{cdm_id}/mitigation_scenarios/{scenario_id}/screening:
    post:
      tags:
      - Mitigation
      summary: Add Scenario Screening
      description: Post screening associated with a theoretical CDM scenario.<br/>
      operationId: add_scenario_screening_conjunction_messages__cdm_id__mitigation_scenarios__scenario_id__screening_post
      security:
      - Oauth2Scheme: []
      parameters:
      - name: cdm_id
        in: path
        required: true
        schema:
          type: string
          title: Cdm Id
      - name: scenario_id
        in: path
        required: true
        schema:
          type: string
          title: Scenario Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ScreeningSubmit'
              - type: 'null'
              description: Screening Submission Parameters
              title: Screening
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Mitigation
      summary: Get Scenario Screening
      description: Get screening associated with a theoretical CDM scenario.<br/>
      operationId: get_scenario_screening_conjunction_messages__cdm_id__mitigation_scenarios__scenario_id__screening_get
      security:
      - Oauth2Scheme: []
      parameters:
      - name: cdm_id
        in: path
        required: true
        schema:
          type: string
          title: Cdm Id
      - name: scenario_key
        in: query
        required: true
        schema:
          type: string
          title: Scenario Key
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
