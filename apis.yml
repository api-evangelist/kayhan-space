aid: kayhan-space
name: Kayhan Space
description: >-
  Kayhan Space is a spaceflight-safety company building autonomous space traffic
  coordination and collision-avoidance technology for satellite operators. Its
  Satcat platform delivers space situational awareness, conjunction assessment
  (CDM ingestion and analysis), on-orbit screening, ephemeris and Two-Line
  Element (TLE) catalog services, propagation, orbit determination, maneuver
  design, and collision-avoidance (COLA) planning through the Satcat Service
  API. Kayhan also offers Dynamics, an astrodynamics estimation and
  orbit-simulation engine. Founded in 2019 and backed by Initialized Capital and
  Techstars, Kayhan Space serves commercial, civil, and defense satellite
  operators.
